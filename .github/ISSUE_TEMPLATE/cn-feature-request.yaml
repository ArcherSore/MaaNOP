name: 功能建议
description: 希望 MaaNOP 增加的功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: describe
    attributes:
      label: 希望实现什么？
      description: 请说明使用场景、希望增加或改进的功能，以及期望达到的效果。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 现在怎么操作？
      description: 请按顺序描述目前的手动操作，或现有功能有哪些不方便的地方。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 截图或补充说明
      description: 可提供相关游戏画面、录屏或其他有助于理解需求的信息。
    validations:
      required: false
