name: 问题反馈
description: MaaNOP 任务异常、识别错误或桌面分身问题
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: 问题描述及复现步骤
      description: 请说明运行了哪个任务、如何触发问题，以及出错的大致时间。
      placeholder: |
        运行的任务：
        操作步骤：
        预期结果：
        实际结果：
        出错时间：
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MaaNOP 版本
      placeholder: 例如 v3.2.1
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 10
        - Windows 11
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: pretask
    attributes:
      label: 出问题前，是否运行过「启动QQ大厅」前置任务？
      description: 「准备运行环境」只准备桌面分身，不代表已执行此前置任务。「启动QQ大厅」会调整游戏窗口尺寸，即使游戏已经打开也会调整。
      options:
        - 已运行成功
        - 未运行
        - 执行失败
        - 不确定
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: 游戏窗口和任务栏
      description: 桌面分身的分辨率和缩放由程序预设，无需填写主桌面参数或测量窗口尺寸。不确定的项目请写「不确定」。
      placeholder: |
        前置任务运行后（或手动打开游戏后），是否调整过游戏窗口大小、最大化窗口：
        是否修改过任务栏大小、位置或自动隐藏设置：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 诊断包
      description: |
        出现问题后，在「设置 → 帮助与诊断 → 问题诊断」点击「导出诊断包」，上传生成的 ZIP 文件，无需先退出软件。
        请上传完整诊断包，不要只复制日志文字或截图日志。
        若无法导出，请填写导出时的错误提示。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: |
        请尽量提供出错时的软件界面，以及桌面分身的完整画面（包含游戏窗口和任务栏），便于判断窗口尺寸和位置。
        桌面分身无法打开时，只需提供软件界面的错误提示。
    validations:
      required: false
